<svg xmlns="http://www.w3.org/2000/svg" width="900" height="280" viewBox="0 0 900 280" role="img" aria-label="SEO und GEO: getrennte Messgrößen"><title>SEO und GEO: getrennte Messgrößen</title><rect width="900" height="280" fill="#f6f4ef"/><text x="30" y="36" font-family="system-ui,sans-serif" font-size="23" font-weight="650" text-anchor="start" fill="#202720">SEO und GEO: getrennte Messgrößen</text><text x="30" y="61" font-family="system-ui,sans-serif" font-size="14" font-weight="400" text-anchor="start" fill="#415b46">Kennzahlen nur mit festgelegter Definition und Stichprobe vergleichen.</text><rect x="30" y="91" width="260" height="70" rx="5" fill="#e2eae1" stroke="#a5afa4"/><text x="160.0" y="120" font-family="system-ui,sans-serif" font-size="18" font-weight="650" text-anchor="middle" fill="#202720">Organische Suche</text><text x="160.0" y="144" font-family="system-ui,sans-serif" font-size="15" font-weight="400" text-anchor="middle" fill="#415b46">Impressionen → Klicks</text><rect x="320" y="91" width="260" height="70" rx="5" fill="#e2eae1" stroke="#a5afa4"/><text x="450.0" y="120" font-family="system-ui,sans-serif" font-size="18" font-weight="650" text-anchor="middle" fill="#202720">KI-Stichprobe</text><text x="450.0" y="144" font-family="system-ui,sans-serif" font-size="15" font-weight="400" text-anchor="middle" fill="#415b46">Antworten → Zitationen</text><rect x="610" y="91" width="260" height="70" rx="5" fill="#e2eae1" stroke="#a5afa4"/><text x="740.0" y="120" font-family="system-ui,sans-serif" font-size="18" font-weight="650" text-anchor="middle" fill="#202720">Website-Nutzung</text><text x="740.0" y="144" font-family="system-ui,sans-serif" font-size="15" font-weight="400" text-anchor="middle" fill="#415b46">Besuche → Aufgaben</text><text x="160" y="190" font-family="system-ui,sans-serif" font-size="15" font-weight="500" text-anchor="middle" fill="#202720">CTR = Klicks / Impressionen</text><text x="450" y="190" font-family="system-ui,sans-serif" font-size="15" font-weight="500" text-anchor="middle" fill="#202720">Quote = Zitationen / Antworten</text><text x="740" y="190" font-family="system-ui,sans-serif" font-size="15" font-weight="500" text-anchor="middle" fill="#202720">Erfolg / beobachtete Besuche</text><line x1="30" y1="220" x2="870" y2="220" stroke="#a5afa4" stroke-width="2"/><text x="450" y="249" font-family="system-ui,sans-serif" font-size="17" font-weight="650" text-anchor="middle" fill="#202720">Unterschiedliche Nenner. Keine gemeinsame Prozentzahl ohne Modell.</text></svg>
