<svg xmlns="http://www.w3.org/2000/svg" width="900" height="280" viewBox="0 0 900 280" role="img" aria-label="Loot: Gewichte und Trefferwahrscheinlichkeit"><title>Loot: Gewichte und Trefferwahrscheinlichkeit</title><rect width="900" height="280" fill="#f6f4ef"/><text x="30" y="36" font-family="system-ui,sans-serif" font-size="23" font-weight="650" text-anchor="start" fill="#202720">Loot: Gewichte und Trefferwahrscheinlichkeit</text><text x="30" y="61" font-family="system-ui,sans-serif" font-size="14" font-weight="400" text-anchor="start" fill="#415b46">Rechenbeispiel ohne Pity-System oder Ziehung ohne Zurücklegen.</text><rect x="40" y="100" width="492" height="40" rx="0" fill="#415b46" stroke="#415b46"/><rect x="532" y="100" width="246" height="40" rx="0" fill="#e2eae1" stroke="#415b46"/><rect x="778" y="100" width="82" height="40" rx="0" fill="#a67d3d" stroke="#a67d3d"/><text x="286" y="126" font-family="system-ui,sans-serif" font-size="18" font-weight="650" text-anchor="middle" fill="#fffefa">60 %</text><text x="655" y="126" font-family="system-ui,sans-serif" font-size="18" font-weight="650" text-anchor="middle" fill="#202720">30 %</text><text x="819" y="126" font-family="system-ui,sans-serif" font-size="15" font-weight="650" text-anchor="middle" fill="#fffefa">10 %</text><text x="40" y="177" font-family="system-ui,sans-serif" font-size="17" font-weight="600" text-anchor="start" fill="#202720">Genau ein gewichteter Eintrag pro Ziehung</text><text x="40" y="205" font-family="system-ui,sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#202720">Bei 10 unabhängigen Ziehungen:</text><text x="40" y="238" font-family="system-ui,sans-serif" font-size="22" font-weight="650" text-anchor="start" fill="#202720">P(mindestens ein 10-%-Treffer) = 1 − 0,9¹⁰ ≈ 65,13 %</text></svg>
