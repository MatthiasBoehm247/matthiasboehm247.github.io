<svg xmlns="http://www.w3.org/2000/svg" width="900" height="280" viewBox="0 0 900 280" role="img" aria-label="Responsive Bilder: drei Quelldateien"><title>Responsive Bilder: drei Quelldateien</title><rect width="900" height="280" fill="#f6f4ef"/><text x="30" y="36" font-family="system-ui,sans-serif" font-size="23" font-weight="650" text-anchor="start" fill="#202720">Responsive Bilder: drei Quelldateien</text><text x="30" y="61" font-family="system-ui,sans-serif" font-size="14" font-weight="400" text-anchor="start" fill="#415b46">Breitenangaben müssen den tatsächlichen Dateiabmessungen entsprechen.</text><rect x="32" y="92" width="240" height="138" rx="5" fill="#fffefa" stroke="#a5afa4"/><rect x="49" y="110" width="112" height="99" rx="5" fill="#e2eae1" stroke="#a5afa4"/><text x="105" y="163" font-family="system-ui,sans-serif" font-size="18" font-weight="650" text-anchor="middle" fill="#202720">400w</text><rect x="308" y="92" width="240" height="138" rx="5" fill="#fffefa" stroke="#a5afa4"/><rect x="325" y="110" width="205" height="99" rx="5" fill="#e2eae1" stroke="#a5afa4"/><text x="427" y="163" font-family="system-ui,sans-serif" font-size="18" font-weight="650" text-anchor="middle" fill="#202720">800w</text><rect x="584" y="92" width="282" height="138" rx="5" fill="#fffefa" stroke="#a5afa4"/><rect x="601" y="110" width="248" height="99" rx="5" fill="#e2eae1" stroke="#a5afa4"/><text x="725" y="163" font-family="system-ui,sans-serif" font-size="18" font-weight="650" text-anchor="middle" fill="#202720">1600w</text><text x="450" y="255" font-family="system-ui,sans-serif" font-size="16" font-weight="650" text-anchor="middle" fill="#202720">sizes beschreibt die CSS-Breite; der Browser wählt die Ressource.</text></svg>
