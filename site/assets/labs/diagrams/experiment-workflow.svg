<svg xmlns="http://www.w3.org/2000/svg" width="900" height="280" viewBox="0 0 900 280" role="img" aria-label="Web-Experiment: vor der Messung planen"><title>Web-Experiment: vor der Messung planen</title><rect width="900" height="280" fill="#f6f4ef"/><text x="30" y="36" font-family="system-ui,sans-serif" font-size="23" font-weight="650" text-anchor="start" fill="#202720">Web-Experiment: vor der Messung planen</text><text x="30" y="61" font-family="system-ui,sans-serif" font-size="14" font-weight="400" text-anchor="start" fill="#415b46">Ein Ablaufmodell, kein tatsächlich durchgeführtes Experiment.</text><rect x="30" y="94" width="250" height="75" rx="5" fill="#e2eae1" stroke="#a5afa4"/><text x="155.0" y="123" font-family="system-ui,sans-serif" font-size="18" font-weight="650" text-anchor="middle" fill="#202720">Hypothese</text><text x="155.0" y="147" font-family="system-ui,sans-serif" font-size="15" font-weight="400" text-anchor="middle" fill="#415b46">Ziel und Messgröße</text><line x1="280" y1="132" x2="325" y2="132" stroke="#415b46" stroke-width="2"/><path d="M325 132 l-9 -5 v10z" fill="#415b46" transform="rotate(0.0 325 132)"/><rect x="325" y="94" width="250" height="75" rx="5" fill="#e2eae1" stroke="#a5afa4"/><text x="450.0" y="123" font-family="system-ui,sans-serif" font-size="18" font-weight="650" text-anchor="middle" fill="#202720">Vergleich</text><text x="450.0" y="147" font-family="system-ui,sans-serif" font-size="15" font-weight="400" text-anchor="middle" fill="#415b46">Gruppen und Daten</text><line x1="575" y1="132" x2="620" y2="132" stroke="#415b46" stroke-width="2"/><path d="M620 132 l-9 -5 v10z" fill="#415b46" transform="rotate(0.0 620 132)"/><rect x="620" y="94" width="250" height="75" rx="5" fill="#e2eae1" stroke="#a5afa4"/><text x="745.0" y="123" font-family="system-ui,sans-serif" font-size="18" font-weight="650" text-anchor="middle" fill="#202720">Auswertung</text><text x="745.0" y="147" font-family="system-ui,sans-serif" font-size="15" font-weight="400" text-anchor="middle" fill="#415b46">Effekt und Unsicherheit</text><line x1="30" y1="204" x2="870" y2="204" stroke="#a5afa4" stroke-width="2"/><text x="450" y="232" font-family="system-ui,sans-serif" font-size="18" font-weight="650" text-anchor="middle" fill="#202720">Vorab: Stichprobe, Abbruchregeln und Ausschlüsse festlegen.</text><text x="450" y="258" font-family="system-ui,sans-serif" font-size="16" font-weight="400" text-anchor="middle" fill="#202720">Nachher: Abweichungen offenlegen; neutrale Ergebnisse zulassen.</text></svg>
