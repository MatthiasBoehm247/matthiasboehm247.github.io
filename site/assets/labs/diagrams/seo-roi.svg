<svg xmlns="http://www.w3.org/2000/svg" width="900" height="280" viewBox="0 0 900 280" role="img" aria-label="ROI: Beitrag statt Umsatz"><title>ROI: Beitrag statt Umsatz</title><rect width="900" height="280" fill="#f6f4ef"/><text x="30" y="36" font-family="system-ui,sans-serif" font-size="23" font-weight="650" text-anchor="start" fill="#202720">ROI: Beitrag statt Umsatz</text><text x="30" y="61" font-family="system-ui,sans-serif" font-size="14" font-weight="400" text-anchor="start" fill="#415b46">Beispielszenario mit einheitlichem Zeitraum.</text><rect x="45" y="106.0" width="210" height="105.0" rx="0" fill="#415b46" stroke="#415b46"/><text x="150" y="96.0" font-family="system-ui,sans-serif" font-size="19" font-weight="650" text-anchor="middle" fill="#202720">2.000 €</text><text x="150" y="238" font-family="system-ui,sans-serif" font-size="18" font-weight="600" text-anchor="middle" fill="#202720">Beitrag</text><rect x="345" y="132.25" width="210" height="78.75" rx="0" fill="#a67d3d" stroke="#a67d3d"/><text x="450" y="122.25" font-family="system-ui,sans-serif" font-size="19" font-weight="650" text-anchor="middle" fill="#202720">1.500 €</text><text x="450" y="238" font-family="system-ui,sans-serif" font-size="18" font-weight="600" text-anchor="middle" fill="#202720">Kosten</text><rect x="645" y="184.75" width="210" height="26.25" rx="0" fill="#415b46" stroke="#415b46"/><text x="750" y="174.75" font-family="system-ui,sans-serif" font-size="19" font-weight="650" text-anchor="middle" fill="#202720">500 €</text><text x="750" y="238" font-family="system-ui,sans-serif" font-size="18" font-weight="600" text-anchor="middle" fill="#202720">Überschuss</text><text x="300" y="168" font-family="system-ui,sans-serif" font-size="27" font-weight="650" text-anchor="middle" fill="#202720">−</text><text x="600" y="168" font-family="system-ui,sans-serif" font-size="27" font-weight="650" text-anchor="middle" fill="#202720">=</text><text x="450" y="265" font-family="system-ui,sans-serif" font-size="16" font-weight="650" text-anchor="middle" fill="#202720">ROI = 500 / 1.500 = 33,3 % (hypothetisch)</text></svg>
